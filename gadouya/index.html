                    "sections": [

                        {

                                "残ったスープにライスを投入して'スープ飯'で〆る。",
                                "熱いうちに食べる！冷めると味が変わります。"
                            ]
                        },
                        {
                            "title": "無限にんにくライス",
                            "icon": "infinity",
                            "content": "ライスを注文して、卓上の無料にんにくを好きなだけ使用。にんにくをライスに混ぜ、ラーメンスープに浸して食べる。伝説の組み合わせ！"
                        }
                    ],
                    "warning": "にんにくは強烈です！少量から始めてください。",
                    "cta_menu": "メニューに戻る"
                }
            }
        };

        const LanguageSelector = ({ onSelect }) => (
            <div className="flex flex-col items-center justify-center min-h-screen p-6 space-y-8 bg-black relative overflow-hidden">
                {/* Logo Background with Fade-in Animation */}
                <div className="absolute inset-0 flex items-center justify-center logo-fade-in">
                    <img 
                        src="image/logo.png" 
                        alt="我道家ロゴ" 
                        className="w-80 h-80 md:w-96 md:h-96 object-contain opacity-70"
                    />
                </div>
                
                <div className="text-center space-y-4 relative z-10 logo-text-fade">
                    <h1 className="text-3xl md:text-4xl font-bold text-white tracking-wider">
                        王道家直系 <span className="gadouya-text">我道家</span> OSAKA本店
                    </h1>
                    <div className="bg-red-600 h-1.5 w-24 mx-auto"></div>
                    <p className="text-gray-400 text-lg">Please select your language</p>
                </div>

                <div className="w-full max-w-lg space-y-6 relative z-10 buttons-fade">
                    <button onClick={() => onSelect('en')} className="w-full py-6 px-8 bg-white text-black font-bold text-3xl rounded-xl shadow-lg hover:bg-gray-200 transition flex items-center justify-between group">
                        <span>English</span>
                        <ChevronDown className="w-8 h-8 group-hover:translate-x-1 transition" />
                    </button>
                    <button onClick={() => onSelect('zh')} className="w-full py-6 px-8 bg-white text-black font-bold text-3xl rounded-xl shadow-lg hover:bg-gray-200 transition flex items-center justify-between group">
                        <span>中文（简体）</span>
                        <ChevronDown className="w-8 h-8 group-hover:translate-x-1 transition" />
                    </button>
                    <button onClick={() => onSelect('ja')} className="w-full py-6 px-8 bg-zinc-800 text-white border-2 border-zinc-700 font-bold text-3xl rounded-xl shadow-lg hover:bg-zinc-700 transition flex items-center justify-between">
                        <span>日本語</span>
                        <span className="text-lg text-gray-400">JAPANESE</span>
                    </button>
                </div>
            </div>
        );

        const NoticeGate = ({ lang, onAccept, onBack }) => {
            const content = SITE_DATA.notice[lang];
            const [checked, setChecked] = useState(false);

            return (
                <div className="min-h-screen bg-zinc-900 p-6 flex flex-col fade-in">
                    <button onClick={onBack} className="text-gray-400 mb-6 flex items-center text-xl font-bold">
                        <ArrowLeft className="w-6 h-6 mr-2" /> {SITE_DATA.common.back[lang]}
                    </button>

                    <div className="flex-1 max-w-2xl mx-auto w-full">
                        {/* Notice Hero: 3-Line Summary */}
                        <div className="bg-red-600 text-white p-6 rounded-t-xl flex items-start space-x-4">
                            <AlertTriangle className="w-10 h-10 flex-shrink-0 mt-1" />
                            <h2 className="font-bold text-3xl leading-tight">{content.title}</h2>
                        </div>
                        
                        <div className="bg-zinc-800 p-8 rounded-b-xl mb-6 shadow-xl border-2 border-zinc-700">
                            {/* Short Bullets */}
                            <ul className="space-y-4 mb-8">
                                {content.bullets.map((txt, i) => (
                                    <li key={i} className="flex items-start text-white font-bold text-2xl">
                                        <span className="text-red-500 mr-3">•</span>
                                        {txt}
                                    </li>
                                ))}
                            </ul>

                            {/* Owner Intent Card */}
                            <div className="bg-zinc-900 p-6 rounded-lg border-l-4 border-red-500 mb-8">
                                <div className="flex items-center text-gray-400 mb-3">
                                    <MessageSquareQuote className="w-6 h-6 mr-2" />
                                    <span className="font-bold uppercase tracking-widest text-sm">{content.intent_title}</span>
                                </div>
                                <p className="text-xl text-gray-200 leading-relaxed font-medium">
                                    {content.why}
                                </p>
                            </div>

                            <label className="flex items-start space-x-4 p-6 bg-zinc-700 rounded-lg cursor-pointer hover:bg-zinc-650 transition">
                                <input 
                                    type="checkbox" 
                                    checked={checked} 
                                    onChange={(e) => setChecked(e.target.checked)}
                                    className="mt-1 w-8 h-8 accent-red-600"
                                />
                                <span className="text-2xl font-bold text-white select-none">
                                    {content.checkbox}
                                </span>
                            </label>

                            <div className="mt-10 space-y-5">

                                    onClick={() => onAccept('order')}
                                    disabled={!checked}
                                    className={`w-full py-6 rounded-xl font-bold text-3xl transition flex flex-col items-center justify-center ${
                                        checked 
                                        ? 'bg-red-600 text-white shadow-lg hover:bg-red-700' 
                                        : 'bg-zinc-600 text-zinc-400 cursor-not-allowed'
                                    }`}
                                >
                                    {content.btn_order}
                                </button>
                                
                                {lang !== 'ja' && (
                                     <button 
                                        onClick={() => onAccept('reference')}
                                        disabled={!checked}
                                        className={`w-full py-5 rounded-xl text-xl transition border-2 ${
                                            checked 
                                            ? 'border-gray-500 text-gray-400 hover:text-white hover:border-white' 
                                            : 'border-zinc-700 text-zinc-600 cursor-not-allowed'
                                        }`}
                                    >
                                        {content.btn_ref}
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const MenuPage = ({ lang, viewMode, setViewMode, onBack, setPage }) => {
            const [activeCat, setActiveCat] = useState('noodles');
            
            const notice = SITE_DATA.notice[lang];
            const categories = SITE_DATA.categories;
            
            // Logic to fetch items based on ViewMode
            const displayItems = useMemo(() => {
                let items = [];
                const isReference = (viewMode === 'reference' || lang === 'ja');
                
                if (isReference) {
                    // Use JP Reference Data
                    const rawItems = SITE_DATA.jp_reference[activeCat] || [];
                    items = rawItems.map(item => ({
                        name: item.name_ja,
                        desc: "",
                        image: item.image || null,
                        priceObj: item.sizes ? item.sizes : { price: item.price }, 
                        isOrderable: (lang === 'ja'), 
                        isMultiSize: !!item.sizes
                    }));
                } else {
                    // Use Intl Order Data
                    items = SITE_DATA.intl_menu
                        .filter(item => {
                            if (activeCat === 'noodles') return item.category === 'noodles';
                            if (activeCat === 'rice') return item.category === 'rice';
                            if (activeCat === 'toppings' || activeCat === 'sides') return item.category === 'sides' || item.category === 'toppings';
                            return false;
                        })
                        .map(item => ({
                            name: item.name[lang] || item.name['en'],
                            desc: item.desc[lang] || item.desc['en'],
                            image: item.image || null,
                            priceObj: { price: item.price },
                            isOrderable: true,
                            isMultiSize: false
                        }));
                }

                return items;
            }, [lang, viewMode, activeCat]);

            return (
                <div className="min-h-screen bg-zinc-900 pb-32 fade-in">

                        <div className="p-4 flex justify-between items-center">
                            <h2 className="font-bold text-white text-xl md:text-2xl pr-2">
                                <span className="hidden sm:inline">{SITE_DATA.meta.shop_name}</span>
                                <span className="sm:hidden">我道家 OSAKA本店</span>
                            </h2>
                            <button onClick={onBack} className="text-lg text-gray-400 border border-gray-600 px-4 py-2 rounded shrink-0">
                                Lang
                            </button>
                        </div>
                        
                        {/* Tab Switcher (Only for non-JA) */}
                        {lang !== 'ja' && (
                            <div className="flex w-full text-xl font-bold">
                                <button 
                                    onClick={() => setViewMode('order')}
                                    className={`flex-1 py-4 text-center transition ${viewMode === 'order' ? 'tab-active bg-zinc-700' : 'tab-inactive bg-zinc-800'}`}
                                >
                                    {notice.menu_tab_order}
                                </button>
                                <button 
                                    onClick={() => setViewMode('reference')}
                                    className={`flex-1 py-4 text-center transition ${viewMode === 'reference' ? 'tab-active bg-zinc-700' : 'tab-inactive bg-zinc-800'}`}
                                >
                                    {notice.menu_tab_ref}
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Reference Warning Banner */}
                    {lang !== 'ja' && viewMode === 'reference' && (
                        <div className="bg-red-900/80 p-4 text-xl text-red-100 flex items-start space-x-3 border-b border-red-700">
                            <Info className="w-8 h-8 shrink-0" />
                            <span>{notice.ref_warning}</span>
                        </div>
                    )}
                    {/* Order Mode Note */}
                    {lang !== 'ja' && viewMode === 'order' && (
                         <div className="bg-yellow-900/30 p-3 text-lg text-yellow-500 text-center border-b border-yellow-900/50 font-bold">
                            Displaying: Fixed Spec Menu (Orderable)
                        </div>
                    )}

                    {/* Category Tabs */}
                    <div className="p-4">
                        <div className="flex space-x-3 overflow-x-auto pb-4 no-scrollbar">
                            {categories
                                /* INTL_CATEGORY_FILTER: 英語・中国語では noodles のみ表示。復活時はこのfilterを削除 */
                                .filter(cat => lang === 'ja' || cat.id === 'noodles')
                                .map(cat => (
                                <button
                                    key={cat.id}
                                    onClick={() => setActiveCat(cat.id)}
                                    className={`whitespace-nowrap px-6 py-3 rounded-full text-xl font-bold transition ${
                                        activeCat === cat.id 
                                        ? 'bg-red-600 text-white' 
                                        : 'bg-zinc-800 text-gray-400 border border-zinc-700'
                                    }`}
                                >
                                    {cat.label[lang]}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Menu List - 1 column layout */}
                    <div className="px-4 space-y-4">
                        {displayItems.map((item, idx) => (
                            <div 
                                key={idx} 
                                className={`rounded-xl border-2 flex flex-col relative overflow-hidden ${
                                    item.isOrderable 
                                    ? 'bg-zinc-800 border-zinc-700' 
                                    : 'bg-zinc-800/50 border-zinc-800 opacity-70'
                                }`}
                            >
                                {!item.isOrderable && (
                                    <div className="absolute top-0 right-0 bg-gray-600 text-white text-xs px-2 py-1 rounded-bl font-bold z-10">
                                        REF
                                    </div>
                                )}
                                
                                {/* Image Section */}
                                {item.image && (
                                    <div className="w-full aspect-video relative">
                                        <img 
                                            src={item.image} 
                                            alt={item.name}
                                            className="w-full h-full object-cover"
                                        />
                                    </div>
                                )}
                                
                                {/* Content Section */}
                                <div className="p-4">
                                    {/* Item Name */}
                                    <h3 className="font-bold text-xl sm:text-2xl text-white leading-tight mb-3">
                                        {item.name}
                                    </h3>
                                    {item.desc && (
                                        <p className="text-sm text-gray-400 italic mb-3">
                                            {item.desc}
                                        </p>
                                    )}
                                    
                                    {/* Single Price Display */}
                                    {!item.isMultiSize && (
                                        <div className={`text-2xl sm:text-3xl font-bold ${item.isOrderable ? 'text-red-500' : 'text-gray-500'}`}>
                                            ¥{item.priceObj.price.toLocaleString()}
                                        </div>
                                    )}

                                    {/* Multi-Size Price - Horizontal Layout */}
                                    {item.isMultiSize && (
                                        <div className="flex gap-3">
                                            {item.priceObj.map((size, sIdx) => (
                                                <div key={sIdx} className="flex-1 bg-zinc-900 rounded-lg py-3 px-2 text-center">
                                                    <div className="text-gray-400 text-sm font-bold mb-1">{size.label_ja || size.label}</div>
                                                    <div className={`text-lg font-bold ${item.isOrderable ? 'text-red-400' : 'text-gray-500'}`}>
                                                        ¥{size.price.toLocaleString()}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}

                        {displayItems.length === 0 && (
                            <div className="col-span-full text-center text-gray-500 py-10 text-2xl">
                                No items in this category.
                            </div>
                        )}
                    </div>

                    {/* Footer Nav */}
                    <div className="fixed bottom-0 left-0 right-0 bg-zinc-900 border-t-2 border-zinc-800 p-2 flex justify-around items-center z-30">
                        <button className="flex flex-col items-center text-red-500 p-1">
                            <Utensils className="w-6 h-6" />
                            <span className="text-xs font-bold mt-0.5">Menu</span>
                        </button>
                        <button onClick={() => setPage('how-to-eat')} className="flex flex-col items-center text-gray-500 p-1 hover:text-white">
                            <Star className="w-6 h-6" />
                            <span className="text-xs font-bold mt-0.5">Tips</span>
                        </button>
                        <button onClick={() => setPage('why-different')} className="flex flex-col items-center text-gray-500 p-1 hover:text-white">
                            <BookOpen className="w-6 h-6" />
                            <span className="text-xs font-bold mt-0.5">Why?</span>
                        </button>
                        <button onClick={() => setPage('faq')} className="flex flex-col items-center text-gray-500 p-1 hover:text-white">
                            <HelpCircle className="w-6 h-6" />
                            <span className="text-xs font-bold mt-0.5">FAQ</span>
                        </button>
                        {lang === 'ja' && (
                            <button onClick={() => setPage('special')} className="flex flex-col items-center text-yellow-500 p-1 hover:text-yellow-300">
                                <Star className="w-6 h-6" />
                                <span className="text-xs font-bold mt-0.5">Special</span>
                            </button>
                        )}
                        {lang === 'ja' && (
                            <button onClick={() => setPage('recruit')} className="flex flex-col items-center text-gray-500 p-1 hover:text-white">
                                <Briefcase className="w-6 h-6" />
                                <span className="text-xs font-bold mt-0.5">求人</span>
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const InfoPage = ({ lang, pageType, onBack, setPage }) => {
            const common = SITE_DATA.common;
            const isFaq = pageType === 'faq';
            const title = isFaq ? common.faq[lang] : common.access[lang];
            const faqData = SITE_DATA.faq[lang] || SITE_DATA.faq['en'];

            return (
                <div className="min-h-screen bg-zinc-900 pb-32 fade-in">
                    <div className="bg-zinc-800 p-4 sticky top-0 z-10 shadow-lg border-b border-zinc-700 flex items-center">
                         <button onClick={() => setPage('menu')} className="mr-4 text-gray-400">
                             <ArrowLeft className="w-8 h-8" />
                         </button>
                        <h2 className="font-bold text-white text-3xl">{title}</h2>
                    </div>

                    <div className="p-6 max-w-2xl mx-auto">
                        {isFaq ? (
                            <div className="space-y-6">
                                {faqData.map((item, i) => (
                                    <div key={i} className="bg-zinc-800 rounded-xl p-6 border-2 border-zinc-700">
                                        <h3 className="text-red-400 font-bold text-xl mb-3">Q. {item.q}</h3>
                                        <p className="text-white text-2xl leading-relaxed">A. {item.a}</p>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="space-y-8 text-center">
                                <div className="bg-red-600 text-white p-8 rounded-xl font-bold text-4xl shadow-lg">
                                    {common.cash_only[lang]}
                                </div>
                                <div className="bg-zinc-800 p-8 rounded-xl border-2 border-zinc-700 space-y-6">
                                    <div className="flex items-center justify-center space-x-3 text-gray-300 text-2xl">
                                        <Clock className="w-8 h-8" />
                                        <span>11:00 - 23:00 (L.O. 22:30)</span>
                                    </div>
                                    <div className="flex items-center justify-center space-x-3 text-gray-300 text-2xl">
                                        <MapPin className="w-8 h-8" />
                                        <span>Osaka, Naniwa Ward</span>
                                    </div>
                                </div>
                                <div className="text-lg text-gray-500 mt-6">
                                    Last Updated: {SITE_DATA.meta.last_updated}
                                    <br/>
                                    {SITE_DATA.meta.price_note[lang]}
                                </div>
                            </div>
                        )}
                    </div>
                     {/* Footer Nav */}
                    <div className="fixed bottom-0 left-0 right-0 bg-zinc-900 border-t-2 border-zinc-800 p-2 flex justify-around items-center z-30">

                            <Utensils className="w-6 h-6" />
                            <span className="text-xs font-bold mt-0.5">Menu</span>
                        </button>
                        <button onClick={() => setPage('how-to-eat')} className="flex flex-col items-center text-gray-500 p-1 hover:text-white">
                            <Star className="w-6 h-6" />
                            <span className="text-xs font-bold mt-0.5">Tips</span>
                        </button>
                        <button onClick={() => setPage('why-different')} className="flex flex-col items-center text-gray-500 p-1 hover:text-white">
                            <BookOpen className="w-6 h-6" />

                                <div className="w-12 h-12 bg-red-500 rounded-full flex items-center justify-center mr-3">
                                    <Users className="w-6 h-6 text-white" />
                                </div>

                                <div className="flex"><span className="text-red-400 font-bold w-20">年齢</span><span>制限無し</span></div>
                                <div className="flex"><span className="text-red-400 font-bold w-20">給料</span><span className="text-xl font-bold text-white">22万円〜50万円以上</span></div>
                                <div className="flex"><span className="text-red-400 font-bold w-20">時間</span><span>8:00〜24:00の間で実働8時間（時間応相談）</span></div>
                            </div>
                            <div className="bg-zinc-900 rounded-lg p-4">
                                <h4 className="text-red-400 font-bold mb-2">待遇</h4>
                                <div className="grid grid-cols-2 gap-2 text-sm text-gray-300">
                                    <div>✓ 週休2日</div>

                                    <div>✓ 昇給年3回</div>
                                    <div>✓ 各種社会保険完備</div>
                                    <div>✓ GROUP店舗の賄い食べ放題</div>
                                    <div>✓ 制服支給</div>
                                    <div>✓ 車・バイク・自転車通勤OK</div>
                                    <div>✓ 出産・育児休暇実績多数有り</div>
                                    <div className="col-span-2">✓ お子様行事全休</div>
                                </div>

                        </div>

                        {/* キャスト */}
                        <div className="bg-zinc-800 rounded-xl p-5 border-2 border-pink-500">
                            <div className="flex items-center mb-4">
                                <div className="w-12 h-12 bg-pink-500 rounded-full flex items-center justify-center mr-3">
                                    <Star className="w-6 h-6 text-white" />

                            <div className="space-y-2 text-gray-300 mb-4">

                                <div className="flex"><span className="text-pink-400 font-bold w-20">時間</span><span>9:00〜24:00の間で応相談</span></div>
                            </div>
                            <div className="bg-zinc-900 rounded-lg p-4">
                                <h4 className="text-pink-400 font-bold mb-2">待遇</h4>
                                <div className="grid grid-cols-2 gap-2 text-sm text-gray-300">

                            </div>
                        </div>

                        {/* メッセージ */}
                        <div className="bg-gradient-to-br from-red-700 to-red-500 rounded-xl p-5">
                            <div className="flex items-center mb-3">
                                <MessageCircle className="w-8 h-8 text-white mr-2" />
                                <h3 className="text-xl font-bold text-white">店主からのメッセージ</h3>

                        <div className="bg-zinc-800 rounded-xl p-5 border-2 border-zinc-600">

                                <Phone className="w-6 h-6 text-green-400 mr-2" />

                                <a 
                                    href="https://x.com/Iekei_osaka?lang=ja" 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="flex items-center bg-black rounded-xl p-4 hover:bg-zinc-700 transition"

                                    <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center mr-3">

                                <a 
                                    href="tel:0743-86-4241"
                                    className="flex items-center bg-green-600 rounded-xl p-4 hover:bg-green-700 transition"
                                >

                                    <div>
                                        <div className="text-white font-bold text-xl">0743-86-4241</div>
                                        <div className="text-white/80 text-sm">タップして電話する</div>
                                    </div>
                                </a>
                            </div>
                        </div>

                        {/* 戻るボタン */}
                        <button 
                            onClick={() => setPage('menu')}
                            className="w-full py-4 bg-zinc-700 text-white font-bold text-lg rounded-xl hover:bg-zinc-600 transition"
                        >
                            メニューに戻る
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState(null); 
            const [gatePassed, setGatePassed] = useState(false);
            const [viewMode, setViewMode] = useState('order'); 
            const [page, setPage] = useState('menu');

            // JP user: Always Order mode
            useEffect(() => {
                if (lang === 'ja') setViewMode('order');
            }, [lang]);

            const handleBackToLang = () => {
                setLang(null);
                setGatePassed(false);
                setPage('menu');
                setViewMode('order');
            };

            const handleGateAccept = (mode) => {
                setGatePassed(true);
                setViewMode(mode);
            };

            if (!lang) {
                return <LanguageSelector onSelect={setLang} />;
            }

            if (!gatePassed) {
                 return <NoticeGate lang={lang} onAccept={handleGateAccept} onBack={handleBackToLang} />;
            }

            if (page === 'menu') {
                return <MenuPage lang={lang} viewMode={viewMode} setViewMode={setViewMode} onBack={handleBackToLang} setPage={setPage} />;
            }

            if (page === 'why-different') {
                return <WhyDifferentPage lang={lang} setPage={setPage} />;
            }

            if (page === 'how-to-eat') {
                return <HowToEatPage lang={lang} setPage={setPage} />;
            }

            if (page === 'recruit') {
                return <RecruitPage setPage={setPage} />;
            }

            if (page === 'special') {
                return <SpecialPage setPage={setPage} />;
            }

            return <InfoPage lang={lang} pageType={page} onBack={handleBackToLang} setPage={setPage} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
